{
  "services": [
    {
      "type": "web",
      "name": "pure-novel-direct",
      "runtime": "python",
      "plan": "free",
      "region": "singapore",
      "repo": "https://github.com/Lucas-2687/pure-novel",
      "branch": "deploy/render-free-trial",
      "autoDeployTrigger": "off",
      "buildCommand": "python -m compileall -q reader.py cloud.py request_budget.py observability.py openbooks.py publications.py",
      "startCommand": "python reader.py --host 0.0.0.0 --port \"$PORT\"",
      "healthCheckPath": "/api/health",
      "envVars": [
        {"key": "REQUIRE_AUTH", "value": "1"},
        {"key": "COOKIE_SECURE", "value": "1"},
        {"key": "READER_RPC_V2", "value": "1"},
        {"key": "PYTHONUNBUFFERED", "value": "1"}
      ]
    }
  ]
}
